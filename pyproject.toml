# Python tooling configuration for fir.
# Covers the SDK (pkg/extension/sdk/python) and bundled extensions (.fir/extensions).

[project]
name = "fir"
version = "0.0.0"
# Python 3.9 minimum — macOS ships with 3.9 and we want everything to work
# out of the box on a fresh macOS install without Homebrew or pyenv.
# Do NOT bump this without updating AGENTS.md and Makefile.
requires-python = ">=3.9"

# --- ruff (linter + formatter) ------------------------------------------------
# Run: uvx ruff check

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade — modernise syntax
  "B",    # flake8-bugbear — likely bugs
  "A",    # flake8-builtins — shadowing builtins
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking — move imports behind TYPE_CHECKING
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit — security
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "T10",  # flake8-debugger — no leftover debugger calls
  "PIE",  # flake8-pie — misc lint
  "RSE",  # flake8-raise
  "RET",  # flake8-return
  "FLY",  # flynt — use f-strings
  "PERF", # perflint — performance anti-patterns
]
ignore = [
  "PT009", # we use unittest.TestCase, not bare assert
]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101", "S106", "S108", "S603", "PLR2004"]
"**/tests/**" = ["S101", "S106", "S108", "S603", "PLR2004"]
".fir/extensions/*.py" = ["E501", "S101", "T201", "S603", "S607", "PERF203"]
# Builtin extensions are the same species of code as .fir/extensions: agent
# tools that shell out (S603/S607), print to stdout (T201), assert internal
# invariants (S101), and carry long embedded tool-description strings (E501).
# Same carve-out, same reasons.
"pkg/resources/builtin_extensions/*.py" = [
  "E501", "S101", "T201", "S603", "S607", "PERF203",
]
"pkg/resources/testdata/*_test.py" = ["E402", "SIM117"]

# --- ty (type checker) --------------------------------------------------------
# Run: uvx ty check

[tool.ty.environment]
extra-paths = ["pkg/extension/sdk/python", "pkg/resources/builtin_extensions", "pkg/resources/testdata"]
python-version = "3.9"
