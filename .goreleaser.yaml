version: 2
project_name: fir

builds:
  - main: ./cmd/fir/
    binary: fir
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.licensesURL=https://github.com/kfet/fir-dist/releases/tag/v{{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
    ignore:
      - goos: darwin
        goarch: arm   # no darwin/arm (32-bit); darwin/arm64 is Apple Silicon

archives:
  - formats: [binary]
    name_template: "fir-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: LICENSE
    - glob: THIRD_PARTY_NOTICES.md

release:
  github:
    owner: kfet
    name: fir
  prerelease: auto
  name_template: "fir {{.Version}}"
  extra_files:
    - glob: LICENSE
    - glob: THIRD_PARTY_NOTICES.md

# ---------------------------------------------------------------------------
# Homebrew tap
#
# GoReleaser regenerates Formula/fir.rb on kfet/homebrew-ai on every
# release. Download URLs point at the public kfet/fir-dist mirror so
# `brew install kfet/ai/fir` works without GitHub authentication.
#
# The default_install_dir reference to main.version keeps the formula's
# embedded version aligned with the one baked into the binary.
# ---------------------------------------------------------------------------
brews:
  - name: fir
    repository:
      owner: kfet
      name: homebrew-ai
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    url_template: "https://github.com/kfet/fir-dist/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/kfet/fir"
    description: "Fast, portable AI coding agent"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "fir: update to {{ .Tag }}"
    skip_upload: auto
    # Duplicate-install warning, computed at display time.
    #
    # GoReleaser emits this block verbatim inside `def caveats; <<~EOS ... EOS; end`,
    # so the whole body is ONE Ruby interpolation: it returns the warning string
    # when a non-Homebrew fir is on PATH, and nil otherwise — leaving a
    # whitespace-only caveats string, which Homebrew suppresses. A clean install
    # stays silent and never execs anything.
    #
    # Constraints when editing: no line may be `EOS` (it would close the
    # heredoc), and no `{{` may appear (GoReleaser templating).
    caveats: |
      #{
        begin
          linked = "#{HOMEBREW_PREFIX}/bin/fir"
          ours = File.exist?(linked) ? File.realpath(linked) : nil
          brewed = [HOMEBREW_PREFIX.to_s, HOMEBREW_CELLAR.to_s]
          others = ENV.fetch("PATH", "").split(File::PATH_SEPARATOR).reject(&:empty?).uniq.filter_map do |dir|
            candidate = File.join(dir, "fir")
            next unless File.file?(candidate) && File.executable?(candidate)
            real = File.realpath(candidate)
            next if real == ours || brewed.any? { |prefix| real.start_with?(prefix) }
            real
          end.uniq
          if others.empty?
            nil
          else
            # One thread per candidate: probing N binaries costs one probe's
            # wall time, not N. FIR_NO_UPDATE_CHECK stops fir >= 1.3 phoning
            # home; older copies ignore it but now stall concurrently.
            listed = others.map do |path|
              Thread.new do
                found = Utils.popen_read({ "FIR_NO_UPDATE_CHECK" => "1" }, path, "--version").lines.first.to_s.strip
                found = "unknown version" if found.empty?
                "  #{path} (#{found})"
              end
            end.map(&:value)
            "Another fir is on your PATH and may shadow this one:\n" +
              listed.join("\n") + "\n  #{linked} (#{version}) <- installed here\n\n" +
              "PATH order decides which one runs, and each updates separately. Remove the\n" +
              "other copy, or put #{HOMEBREW_PREFIX}/bin first on PATH."
          end
        rescue StandardError
          nil
        end
      }
    test: |
      system "#{bin}/fir", "--version"
    # The downloaded artifact is named fir-<os>-<arch> (archives.formats=binary
    # emits raw binaries, not tarballs), so `bin.install "fir"` fails with
    # ENOENT. Glob the staged artifact and rename it on install.
    install: |
      bin.install Dir["fir-*"].first => "fir"
      chmod 0755, bin/"fir"
      generate_completions_from_executable(bin/"fir", "completion", shells: [:bash, :zsh])

  # Pinned per-minor-version formula for rollback / version-pinning.
  #
  # Each release publishes Formula/fir@MAJOR.MINOR.rb in the tap. Patch
  # releases overwrite the file for that minor channel. Users roll back
  # (or pin) with:
  #
  #   brew unlink fir 2>/dev/null
  #   brew install kfet/ai/fir@0.29   # or: brew link --overwrite fir@0.29
  #
  # No keg_only, no conflicts_with: linking just clashes on bin/fir, so
  # `brew install fir@X.Y` lands the keg but the user must clobber the
  # rolling symlink to actually use it (`brew unlink fir` or
  # `brew link --overwrite fir@X.Y`). That is the rollback flow.
  # The tap-prune workflow keeps only the 10 most recent minors.
  - name: "fir@{{ .Major }}.{{ .Minor }}"
    repository:
      owner: kfet
      name: homebrew-ai
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    url_template: "https://github.com/kfet/fir-dist/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/kfet/fir"
    description: "Fast, portable AI coding agent (pinned {{ .Major }}.{{ .Minor }})"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "fir@{{ .Major }}.{{ .Minor }}: update to {{ .Tag }}"
    skip_upload: auto
    caveats: |
      This is a pinned channel (fir@{{ .Major }}.{{ .Minor }}). It ships
      its own bin/fir, which collides with the rolling kfet/ai/fir
      formula if you have both installed.

      To switch to this version (e.g. for rollback):
        brew unlink fir 2>/dev/null
        brew link --overwrite fir@{{ .Major }}.{{ .Minor }}

      To go back to the rolling latest:
        brew unlink fir@{{ .Major }}.{{ .Minor }}
        brew link fir
    test: |
      system "#{bin}/fir", "--version"
    install: |
      bin.install Dir["fir-*"].first => "fir"
      chmod 0755, bin/"fir"
      generate_completions_from_executable(bin/"fir", "completion", shells: [:bash, :zsh])

changelog:
  use: github-native
