name: release

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a specific release. Useful when the original
  # tag-push trigger was missed (e.g. GitHub Actions outage) or when
  # we need to re-publish a tag's assets without retagging. The job
  # checks out the resolved tag and feeds it to GoReleaser + mirror
  # so the run is byte-equivalent to a fresh tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.50.0). Leave empty to use the latest tag.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Resolve the effective release tag:
      #   - push:   github.ref_name (the pushed tag)
      #   - manual: inputs.tag, or the latest tag if blank
      # Exported via $GITHUB_ENV so downstream steps reference $TAG.
      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$PUSH_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh api "/repos/${{ github.repository }}/tags" --jq '.[0].name')
            if [ -z "$TAG" ]; then
              echo "::error::no tags found on repository"
              exit 1
            fi
          fi
          echo "Resolved tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the resolved tag so GoReleaser builds the right
          # commit. fetch-depth: 0 preserves tag visibility for
          # `git describe` inside GoReleaser.
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Set up uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      - name: Guard release version
        uses: kfet/gha/release-guard@4c729c719a3c76fbfa85c26722f0bd1ab63216ba

      # The compiled-in model catalog is only a snapshot of whatever was last
      # committed, so a release could otherwise ship provider data months stale.
      # Regenerate it here and let `make all` compile AND test the result, so
      # every release bakes in the current catalog.
      #
      # This must never block a release: day-to-day churn between releases is
      # already handled by the catalog overlay (pkg/models/catalog-v1.json ->
      # kfet/fir-dist, hot-applied on a TTL), so if models.dev / OpenRouter are
      # unreachable we simply fall back to the committed snapshot.
      - name: Refresh model catalog
        continue-on-error: true
        run: make generate-models

      - name: Build and test
        run: make all

      - name: Generate third-party notices
        run: make notices

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          # --skip=validate: the "Refresh model catalog" step above deliberately
          # regenerates pkg/ai/models_generated.go so every release bakes in the
          # current catalog. That leaves the checkout dirty by design, which
          # GoReleaser's git-state validation rejects ("git is in a dirty
          # state"). The tag is already resolved and guarded by the
          # release-guard step, so validation buys nothing here.
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # ---------------------------------------------------------------
      # Mirror release to the public binary-distribution repo.
      #
      # kfet/fir-dist is a public, binaries-only mirror. It carries the
      # same assets (binaries, LICENSE, THIRD_PARTY_NOTICES.md,
      # checksums.txt) under the same tag so install.sh, the self-updater
      # and packagers can eventually read from it without needing auth.
      #
      # Requires a repository secret FIR_DIST_TOKEN: a fine-grained PAT
      # with "Contents: read and write" on kfet/fir-dist only. The
      # default GITHUB_TOKEN is scoped to kfet/fir and cannot push
      # cross-repo.
      #
      # We mirror by re-downloading the source release's assets via gh
      # (authenticated as the source-repo token), then re-uploading them
      # with FIR_DIST_TOKEN. This keeps the two releases byte-identical
      # and avoids coupling to GoReleaser's dist/ layout.
      #
      # The step is idempotent: re-running on the same tag overwrites
      # assets (--clobber) rather than failing.
      # ---------------------------------------------------------------
      - name: Mirror release to kfet/fir-dist
        env:
          MIRROR_TOKEN: ${{ secrets.FIR_DIST_TOKEN }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAG comes from the "Resolve release tag" step's $GITHUB_ENV
          # export — works for both push and workflow_dispatch.
          MIRROR_REPO: kfet/fir-dist
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::warning::FIR_DIST_TOKEN not set — skipping mirror to $MIRROR_REPO"
            exit 0
          fi

          STAGING="$(mktemp -d)"
          trap 'rm -rf "$STAGING"' EXIT

          # Download every asset from the source release using the
          # default GITHUB_TOKEN (scoped to $SOURCE_REPO).
          GH_TOKEN="$SOURCE_TOKEN" gh release download "$TAG" \
            --repo "$SOURCE_REPO" \
            --dir "$STAGING" \
            --skip-existing

          # Collect non-empty files. GitHub's asset upload rejects
          # zero-byte files with HTTP 400 Bad Content-Length.
          mapfile -t ASSETS < <(find "$STAGING" -maxdepth 1 -type f ! -empty | sort)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::source release $SOURCE_REPO@$TAG has no assets to mirror"
            exit 1
          fi

          echo "Mirroring ${#ASSETS[@]} assets to $MIRROR_REPO@$TAG:"
          for a in "${ASSETS[@]}"; do
            printf '  %s (%s bytes)\n' "$(basename "$a")" "$(wc -c <"$a")"
          done

          # Pull release notes from the source release so the mirror
          # shows the same changelog.
          NOTES_FILE="$(mktemp)"
          GH_TOKEN="$SOURCE_TOKEN" gh release view "$TAG" \
            --repo "$SOURCE_REPO" --json body --jq .body > "$NOTES_FILE" \
            || echo "See https://github.com/$SOURCE_REPO/releases/tag/$TAG" > "$NOTES_FILE"

          # Switch to the mirror token for everything touching fir-dist.
          export GH_TOKEN="$MIRROR_TOKEN"

          if ! gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$MIRROR_REPO" \
              --title "fir ${TAG#v}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag=false
          else
            echo "Release $TAG already exists on $MIRROR_REPO — updating assets."
          fi

          gh release upload "$TAG" \
            --repo "$MIRROR_REPO" \
            --clobber \
            "${ASSETS[@]}"

          echo "Mirrored to https://github.com/$MIRROR_REPO/releases/tag/$TAG"

  # ---------------------------------------------------------------
  # Smoke-test the freshly-published tap on a clean runner.
  #
  # This is the only thing standing between "tap pushed" and "user
  # runs `brew upgrade` and gets EACCES / sha mismatch / missing
  # completion / signing breakage". Runs `brew install kfet/ai/fir`
  # on a real macOS and a real Linuxbrew box, then exercises the
  # binary just like a real user would.
  #
  # Background: we shipped a regression where the install block
  # called generate_completions_from_executable on a 0644 file (raw
  # binaries published via archives.formats=binary land without an
  # exec bit, and bin.install is just FileUtils.mv). It went
  # undetected for several releases because nothing in CI ever did
  # `brew install` against the published tap. This job closes that
  # gap.
  #
  # Runs after the mirror step because the tap's formula URLs point
  # at kfet/fir-dist — the mirror must exist before brew can fetch.
  # ---------------------------------------------------------------
  brew-smoke:
    needs: release
    # Bounds a WEDGED brew install (these jobs do network installs and have
    # hung before). It does NOT bound time spent waiting for a runner —
    # timeout-minutes only starts counting once a runner picks the job up.
    # A `runs-on` label that no available runner matches sits in "waiting for
    # a runner" until GitHub's ~24h queue cull, which is exactly how the
    # retired macos-13 leg hung v0.89.0 and v0.90.0. Hence: only use labels
    # that are known to resolve.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64); macos-15-intel = Intel
        # (amd64); ubuntu-latest = Linuxbrew. The two mac legs matter because
        # fir ships both darwin arm64 and amd64, and the formula's Intel path
        # (/usr/local prefix, amd64 asset selection) differs from arm64's
        # /opt/homebrew.
        #
        # This previously used macos-13 for the Intel leg. GitHub retired that
        # image, the label stopped resolving, and the job sat in "waiting for
        # a runner" until cancelled by hand (v0.89.0 ~7h, v0.90.0 50m+).
        # macos-15-intel is its successor and was verified out-of-band before
        # being put back here — see runner-probe.yml, which exists so that a
        # candidate label is never trialled inside a release run. Run it
        # (Actions → runner-probe → Run workflow) before changing any label
        # below.
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Linuxbrew intermittently dies with "Broken pipe" right after `brew tap`
    # (during Homebrew's JSON-API pipe work). That flake is handled by the
    # bounded retry in the install step below, NOT by env hardening.
    #
    # DO NOT re-add HOMEBREW_NO_INSTALL_FROM_API=1. It was here to suppress
    # that flake, but it also forces brew to resolve everything through a
    # local homebrew/core git checkout. The ubuntu-latest image ships no core
    # tap ("Homebrew/homebrew-core N/A"), so `brew tap` cloned core at master
    # HEAD (1.4GB, 5.5min) while HOMEBREW_NO_AUTO_UPDATE kept the image's brew
    # library frozen at 6.0.11. Weeks-newer core formulae then failed to
    # import en masse with "undefined method 'run'/'on_macos'/'if_path_exists'
    # for an instance of Homebrew::InstallSteps::DSL", and `brew install`
    # exited 1 on an unrelated core formula even though kfet/ai/fir itself
    # resolved fine. That reddened the Linux leg on every release from v0.90.2
    # on. The macOS legs only escaped because their images happen to ship a
    # core checkout from the same era as their library.
    #
    # With the JSON API enabled our zero-dependency formula never needs core
    # at all: the leg now finishes in ~66s instead of 6.5min, and it exercises
    # the same path a real user does.
    #
    # Note: HOMEBREW_NO_* switches are presence-checked, not value-checked —
    # setting one to "0" still counts as set. To disable one, delete the line.
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_CURL_RETRIES: "5"
    steps:
      - name: Install via Homebrew tap
        run: |
          set -euxo pipefail
          # Linuxbrew lives at /home/linuxbrew/.linuxbrew on Ubuntu
          # runners but isn't on PATH by default.
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew --version
          # Bounded retry for the transient "Broken pipe" during Homebrew's
          # JSON API fetch. This tolerates a flaky network only: a genuinely
          # broken formula (bad sha256, missing asset, unresolvable name)
          # fails deterministically on all three attempts and turns the leg
          # red, which is the point of the leg. Verified both ways on a real
          # runner before landing. `brew tap` is idempotent, so a retry can
          # just repeat it rather than testing for it first.
          ok=0
          for attempt in 1 2 3; do
            echo "--- attempt $attempt"
            if brew tap kfet/ai && brew install kfet/ai/fir; then ok=1; break; fi
            echo "attempt $attempt failed"
            [ "$attempt" = 3 ] || sleep 10
          done
          [ "$ok" = "1" ] || { echo "::error::brew install failed after 3 attempts"; exit 1; }

      - name: Exercise the installed binary
        run: |
          set -euxo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          which fir
          fir --version
          # Exercise the same exec path that broke with EACCES.
          # Sink stdout: piping into `head` triggers SIGPIPE on the
          # Go producer (exit 141) under `set -o pipefail`, which
          # would fail this step for the wrong reason.
          fir completion bash > /dev/null
          fir completion zsh  > /dev/null
          # Run the formula's own test block too, for good measure.
          brew test kfet/ai/fir
