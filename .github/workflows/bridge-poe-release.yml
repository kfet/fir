name: bridge-poe-release

on:
  push:
    tags:
      - "poe-bridge/v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: external/poe

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: external/poe/go.mod

      - name: Test
        run: go test -race ./...

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/poe-bridge/}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        run: |
          VERSION=${{ steps.version.outputs.version }}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          for spec in "darwin arm64" "darwin amd64" "linux arm64" "linux amd64" "linux arm"; do
            set -- $spec
            OUT="dist/poe-bridge-$1-$2"
            [ "$2" = "arm" ] && OUT="dist/poe-bridge-$1-armv6"
            echo "Building $OUT..."
            GOOS=$1 GOARCH=$2 GOARM=6 go build -trimpath -ldflags="$LDFLAGS" -o "$OUT" ./cmd/poe-bridge/
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: poe-bridge/${{ steps.version.outputs.tag }}
          name: poe-bridge ${{ steps.version.outputs.tag }}
          body: "Poe channel bridge ${{ steps.version.outputs.tag }}"
          files: external/poe/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
