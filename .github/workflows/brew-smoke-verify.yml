# TEMPORARY — verification harness for the brew-smoke fix.
# Delete once the fix is folded into release.yml.
#
# Round 1 (30743919399): control -> RED (core clone vs frozen library skew);
#   API-on -> 4/5 green in ~30s, core never tapped, 1/5 "Broken pipe".
# Round 2 (30744185213): api_retry 10/10 green ~66s; api_update 3/3 green ~408s.
# Round 3 (30744463802): retry recovers from an injected attempt-1 failure;
#   an unresolvable formula still exhausts 3 attempts and exits non-zero.
# Round 4 (this one): the env change is job-level in release.yml, so it also
#   touches the two currently-GREEN macOS legs. Confirm the candidate env +
#   retry is green there too before applying it uniformly.
name: brew-smoke-verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
        rep: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_CURL_RETRIES: "5"
    steps:
      - name: Install via Homebrew tap (candidate env)
        run: |
          set -euxo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew --version
          ok=0
          for attempt in 1 2 3; do
            echo "--- attempt $attempt"
            if brew tap | grep -qx 'kfet/ai' || brew tap kfet/ai; then
              if brew install kfet/ai/fir; then ok=1; break; fi
            fi
            echo "attempt $attempt failed; retrying"
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "::error::brew install failed after 3 attempts"; exit 1; }

      - name: Exercise the installed binary
        run: |
          set -euxo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          which fir
          fir --version
          fir completion bash > /dev/null
          fir completion zsh  > /dev/null
          brew test kfet/ai/fir
