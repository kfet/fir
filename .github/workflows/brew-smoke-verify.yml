# TEMPORARY: runs the EXACT release.yml brew-smoke steps. Delete on landing.
name: brew-smoke-verify
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  final:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - macos-15-intel
        rep:
        - 1
        - 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env: &id001
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_CURL_RETRIES: '5'
    steps:
    - &id002
      name: Install via Homebrew tap
      run: "set -euxo pipefail\n# Linuxbrew lives at /home/linuxbrew/.linuxbrew on Ubuntu\n# runners but isn't on PATH by default.\nif [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then\n  eval \"$(/home/linuxbrew/.linuxbrew/bin/brew\
        \ shellenv)\"\nfi\nbrew --version\n# Bounded retry for the transient \"Broken pipe\" during Homebrew's\n# JSON API fetch. This tolerates a flaky network only: a genuinely\n# broken formula (bad\
        \ sha256, missing asset, unresolvable name)\n# fails deterministically on all three attempts and turns the leg\n# red, which is the point of the leg. Verified both ways on a real\n# runner before\
        \ landing. `brew tap` is idempotent, so a retry can\n# just repeat it rather than testing for it first.\nok=0\nfor attempt in 1 2 3; do\n  echo \"--- attempt $attempt\"\n  if brew tap kfet/ai &&\
        \ brew install kfet/ai/fir; then ok=1; break; fi\n  echo \"attempt $attempt failed\"\n  [ \"$attempt\" = 3 ] || sleep 10\ndone\n[ \"$ok\" = \"1\" ] || { echo \"::error::brew install failed after\
        \ 3 attempts\"; exit 1; }\n"
    - &id003
      name: Exercise the installed binary
      run: "set -euxo pipefail\nif [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then\n  eval \"$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)\"\nfi\nwhich fir\nfir --version\n# Exercise the same exec path\
        \ that broke with EACCES.\n# Sink stdout: piping into `head` triggers SIGPIPE on the\n# Go producer (exit 141) under `set -o pipefail`, which\n# would fail this step for the wrong reason.\nfir completion\
        \ bash > /dev/null\nfir completion zsh  > /dev/null\n# Run the formula's own test block too, for good measure.\nbrew test kfet/ai/fir\n"
  tap_idempotent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: *id001
    steps:
    - name: 'tap twice: assert idempotent'
      run: 'set -euxo pipefail

        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

        # The retry loop re-runs `brew tap kfet/ai` on every attempt, so a second tap

        # of an already-tapped repo must exit 0. Assert that directly.

        brew tap kfet/ai

        brew tap kfet/ai

        echo "OK: re-tapping an already-tapped repo exits 0"

        '
    - *id002
    - *id003
