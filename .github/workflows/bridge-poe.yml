name: bridge-poe

on:
  push:
    paths:
      - "external/poe/**"
    branches: [main, "wt/**"]
  pull_request:
    paths:
      - "external/poe/**"

defaults:
  run:
    working-directory: external/poe

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: external/poe/go.mod

      - name: fmt-check
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then echo "gofmt issues:"; echo "$diff"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race ./...

      - name: build (all targets)
        run: |
          for target in "darwin arm64" "darwin amd64" "linux arm64" "linux amd64" "linux arm"; do
            set -- $target
            echo "Building $1/$2..."
            GOOS=$1 GOARCH=$2 go build -trimpath -o /dev/null ./cmd/poe-bridge/
          done
